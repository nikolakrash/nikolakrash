<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переход к оплате | TeleBoosting</title>
    <link rel="icon" type="image/x-icon" href="static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="static/favicon-16x16.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 24px;
            background: #0f172a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .box {
            width: 100%;
            max-width: 520px;
            padding: 36px 28px;
            border-radius: 22px;
            background: rgba(15, 23, 42, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        .icon {
            width: 78px;
            height: 78px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(59, 130, 246, 0.14);
            color: #93c5fd;
            font-size: 1.9rem;
        }

        h1 {
            font-size: 1.9rem;
            margin-bottom: 14px;
        }

        p {
            color: rgba(255, 255, 255, 0.78);
            margin-bottom: 20px;
        }

        .status {
            min-height: 24px;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        .actions {
            display: none;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .actions.visible {
            display: flex;
        }

        .btn {
            border-radius: 12px;
            padding: 12px 18px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">
            <i id="status-icon" class="fas fa-circle-notch fa-spin"></i>
        </div>
        <h1>Перенаправляем на оплату</h1>
        <p>T-Bank форма сейчас откроется автоматически.</p>
        <div id="status" class="status">Создаём платёж...</div>
        <div id="actions" class="actions">
            <button id="retry-btn" class="btn btn-primary" type="button">Повторить</button>
            <a class="btn btn-outline-light" href="index.html">На главную</a>
        </div>
    </div>

    <script>
        const TERMINAL_KEY = '1783065318794';
        const PASSWORD = 'E7DKRNJ$D%tvWrYm';
        const INIT_URL = 'https://securepay.tinkoff.ru/v2/Init';
        const AMOUNT = 10000;
        const DESCRIPTION = 'Оплата TeleBoosting 100 RUB';
        const statusNode = document.getElementById('status');
        const statusIcon = document.getElementById('status-icon');
        const actions = document.getElementById('actions');
        const retryBtn = document.getElementById('retry-btn');

        function setLoading(text) {
            statusNode.textContent = text;
            statusIcon.className = 'fas fa-circle-notch fa-spin';
            actions.classList.remove('visible');
        }

        function setError(text) {
            statusNode.textContent = text;
            statusIcon.className = 'fas fa-triangle-exclamation';
            actions.classList.add('visible');
        }

        function buildOrderId() {
            return `tb-pay-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
        }

        function buildRedirectDueDate() {
            const date = new Date(Date.now() + 89 * 24 * 60 * 60 * 1000);
            const pad = (value) => String(value).padStart(2, '0');
            const year = date.getFullYear();
            const month = pad(date.getMonth() + 1);
            const day = pad(date.getDate());
            const hours = pad(date.getHours());
            const minutes = pad(date.getMinutes());
            const seconds = pad(date.getSeconds());
            return `${year}-${month}-${day}T${hours}:${minutes}:${seconds}+00:00`;
        }

        async function sha256Hex(input) {
            const data = new TextEncoder().encode(input);
            const digest = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(digest))
                .map(byte => byte.toString(16).padStart(2, '0'))
                .join('');
        }

        async function buildToken(payload) {
            const tokenFields = { Password: PASSWORD };
            Object.keys(payload)
                .sort()
                .forEach((key) => {
                    tokenFields[key] = String(payload[key]);
                });

            const concat = Object.keys(tokenFields)
                .sort()
                .map((key) => tokenFields[key])
                .join('');

            return sha256Hex(concat);
        }

        async function redirectToPayment() {
            setLoading('Создаём платёж...');

            const payload = {
                TerminalKey: TERMINAL_KEY,
                Amount: AMOUNT,
                OrderId: buildOrderId(),
                Description: DESCRIPTION,
                SuccessURL: `${window.location.origin}/payment-success.html`,
                FailURL: `${window.location.origin}/payment.html?status=fail`,
                RedirectDueDate: buildRedirectDueDate()
            };

            try {
                payload.Token = await buildToken(payload);

                const response = await fetch(INIT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok || !data.Success || !data.PaymentURL) {
                    throw new Error(data.Message || 'Не удалось создать платёж.');
                }

                window.location.replace(data.PaymentURL);
            } catch (error) {
                setError(error.message || 'Ошибка при создании платежа.');
            }
        }

        retryBtn.addEventListener('click', redirectToPayment);
        redirectToPayment();
    </script>
</body>
</html>
