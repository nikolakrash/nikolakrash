<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата завершена | TeleBoosting</title>
    <link rel="canonical" href="https://teleboosting.com/payment-success">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/x-icon" href="static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="static/favicon-16x16.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 45%, #0b1120 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .success-card {
            max-width: 640px;
            width: 100%;
            padding: 40px 32px;
            border-radius: 24px;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        .success-icon {
            width: 88px;
            height: 88px;
            margin: 0 auto 22px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 2rem;
            background: rgba(34, 197, 94, 0.16);
            color: #4ade80;
        }

        .success-card h1 {
            margin-bottom: 16px;
        }

        .success-card p {
            color: rgba(255, 255, 255, 0.78);
            margin-bottom: 28px;
        }

        .success-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .success-actions .btn {
            border-radius: 14px;
            padding: 12px 18px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>
        <h1>Оплата успешно завершена</h1>
        <p>Платёж через СБП успешно завершён. При необходимости вы можете снова открыть страницу оплаты и повторить сценарий через T-Bank.</p>
        <div class="success-actions">
            <a class="btn btn-primary" href="payment.html">Открыть страницу оплаты</a>
            <a class="btn btn-outline-light" href="index.html">На главную</a>
        </div>
    </div>
</body>
</html>
